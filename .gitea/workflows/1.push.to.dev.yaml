name: Push changes to dev repo folder
run-name: ${{ gitea.actor }} is building frontend 🚀
on:
  push:
    branches:
      - development

jobs:
  Building-Angular-Frontend:
    runs-on: linux_host
    steps:
      - uses: actions/checkout@v3
      - name: Push files to dev repo folder
        run: git remote add dev-wsys ssh://dev.wsys.ee:/data01/virt108664/domeenid/www.dev.wsys.ee/htdocs/dev/eki_storybook/
      - run: git status
      - run: git branch
      - run: git log
      - run: git status
      - run: git remote -v
      - run: git pull origin development:development
      - run: git pull dev-wsys development:development
      - run: git push dev-wsys development:development
      - name: Log into dev.wsys and build project
        run: ssh ${{ secrets.HOST }} "cd ${{ secrets.TARGET_FOLDER }}; npm run build-storybook;"
      - run: echo "🍏 This job's status is ${{ job.status }}."
